<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capital Experts - Detalle de Proyecto</title>
    <!-- TODO: Add SRI integrity attributes -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link href="https://unpkg.com/@tailwindcss/custom-forms/dist/custom-forms.min.css" rel="stylesheet" />
    <style>
        .gradient {
            background: #0E0E19 0% 0% no-repeat padding-box;
            opacity: 1;
        }
    </style>
</head>

<body class="h-screen w-screen gradient">
    <div id="parent" class="w-full md:w-3/4 lg:w-2/3 mx-auto">
    </div>
    <div id="images" class="w-full mx-auto">
    </div>
    <script>
        const projects = {
            'torre-y-19': {
                mainImg: './assets/img/gallery/Torre-Y19-3-1024x598.jpg',
                images: [
                    './assets/img/proyects/torre-y-19/Torre-Y19-1.jpg',
                    './assets/img/proyects/torre-y-19/Torre-Y19-2.jpg',
                    './assets/img/proyects/torre-y-19/Torre-Y19-3.jpg'
                ]
            },
            'rosarito-1': {
                mainImg: './assets/img/gallery/Residencial-Rosarito-1.jpg',
                images: [
                    './assets/img/proyects/rosarito-1/Residencial-Rosarito-1.jpg',
                    './assets/img/proyects/rosarito-1/Residencial-Rosarito-2.jpg'
                ]
            },
            'carwash': {
                mainImg: './assets/img/gallery/Carwash-BW-1.jpg',
                images: [
                    './assets/img/proyects/carwash/Carwash-BW-1.jpg',
                    './assets/img/proyects/carwash/Carwash-BW-2.jpg',
                    './assets/img/proyects/carwash/Carwash-BW-3.jpg',
                    './assets/img/proyects/carwash/Carwash-BW-4.jpg'
                ]
            },
            'nave-murua-3': {
                mainImg: './assets/img/gallery/Nave-Murua-3.jpeg',
                images: [
                    './assets/img/proyects/nave-murua-3/Nave-Murua-1.jpg',
                    './assets/img/proyects/nave-murua-3/Nave-Murua-2.jpeg',
                    './assets/img/proyects/nave-murua-3/Nave-Murua-3.jpeg'
                ]
            },
            'casas-libertad-1': {
                mainImg: './assets/img/gallery/Casas-Libertad-1-1024x783.jpg',
                images: [
                    './assets/img/proyects/casas-libertad-1/Casas-Libertad-1.jpg'
                ]
            }
        };

        function getParam(paramName) {
            const parameters = new URLSearchParams(window.location.search);
            return parameters.get(paramName);
        }

        function assignVal() {
            const val = getParam('name');
            const project = projects[val];
            const parentElement = document.getElementById("parent");
            const imagesElement = document.getElementById("images");

            if (!project) {
                const title = document.createElement("h1");
                title.textContent = "Proyecto no encontrado";
                title.className = 'text-white uppercase text-center text-4xl p-5';
                parentElement.appendChild(title);
                return;
            }

            const title = document.createElement("h1");
            title.textContent = val;
            title.className = 'text-white uppercase text-center text-4xl p-5';
            parentElement.appendChild(title);

            const mainImg = document.createElement("img");
            mainImg.src = project.mainImg;
            mainImg.alt = "Imagen principal de " + val;
            mainImg.className = 'w-full my-5 h-1/2';
            parentElement.appendChild(mainImg);

            if (project.images && project.images.length > 0) {
                const imgDiv = document.createElement("div");
                imgDiv.className = 'w-10/12 mx-auto h-1/2 flex flex-row flex-wrap justify-center';
                
                project.images.forEach((imgSrc) => {
                    const link = document.createElement("a");
                    link.className = 'w-1/3 my-5 h-1/2 pr-2';
                    link.href = imgSrc;

                    const img = document.createElement("img");
                    img.src = imgSrc;
                    img.alt = "Imagen de galería de " + val;
                    img.className = 'w-full my-5 h-1/2 pr-2';
                    
                    link.appendChild(img);
                    imgDiv.appendChild(link);
                });
                
                imagesElement.appendChild(imgDiv);
            }
        }
        
        assignVal();
    </script>
</body>

</html>
