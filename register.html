                <div class="w-5/6 lg:w-1/2 mx-auto bg-white rounded shadow">
                    <div class="py-4 px-8 text-black text-xl border-b border-grey-lighter">Registrarse
                    </div>
                    <div class="py-4 px-8">
                        <div class="flex mb-4">
                            <div class="w-1/2 mr-1">
                                <label class="block text-grey-darker text-sm font-bold mb-2" for="first_name">Nombre</label>
                                <input class="appearance-none border rounded w-full py-2 px-3 text-grey-darker"
                                    id="first_name" type="text" placeholder="Your first name">
                            </div>
                            <div class="w-1/2 ml-1">
                                <label class="block text-grey-darker text-sm font-bold mb-2" for="last_name">Apellido</label>

                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="block text-grey-darker text-sm font-bold mb-2" for="email">Correo</label>
                            <input class="appearance-none border rounded w-full py-2 px-3 text-grey-darker" id="email"
                                type="email" placeholder="Your email address">
                        </div>
                        <div class="mb-4">
                            <label class="block text-grey-darker text-sm font-bold mb-2" for="password">Contraseña</label>
                            <input class="appearance-none border rounded w-full py-2 px-3 text-grey-darker"
                                id="password" type="password" placeholder="Your secure password">
                            <p class="text-grey text-xs mt-1">Minimo 6 caracteres</p>
                        </div>
                        <div class="flex items-center justify-between mt-8">
                            <button class="bg-blue hover:bg-blue-dark text-white font-bold py-2 px-4 rounded-full"
