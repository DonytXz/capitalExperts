<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capital Experts - Registro</title>
    <!-- TODO: Add SRI integrity attributes -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link href="https://unpkg.com/@tailwindcss/custom-forms/dist/custom-forms.min.css" rel="stylesheet" />
    <style>
        .gradient {
            background: #0E0E19 0% 0% no-repeat padding-box;
            opacity: 1;
        }

        .bg-aqua {
            background-color: #48D7E5;
        }
    </style>
</head>

<body class="gradient">
    <div class="font-sans antialiased bg-grey-lightest">
        <!-- Top Nav -->
        <div class=" w-full fixed shadow z-10">
            <div class="container mx-auto">
                <div class="w-full flex justify-between items-center py-4 px-8">
                    <!-- Brand -->
                    <a href="index.html">
                        <img width="200" height="50" src="./assets/img/logo-capital-experts.svg" alt="Capital Experts Logo">
                    </a>
                </div>
            </div>
        </div>
        <!-- Content -->
        <div class="w-full h-full bg-grey-lightest" style="padding-top: 4rem;">
            <div class="container my-auto mx-auto py-8">
                <div class="w-5/6 lg:w-1/2 mx-auto bg-white rounded shadow">
                    <div class="py-4 px-8 text-black text-xl border-b border-grey-lighter">Registrarse
                    </div>
                    <form method="POST" action="#" class="py-4 px-8">
                        <div class="flex mb-4">
                            <div class="w-1/2 mr-1">
                                <label class="block text-grey-darker text-sm font-bold mb-2" for="first_name">Nombre</label>
                                <input class="appearance-none border rounded w-full py-2 px-3 text-grey-darker"
                                    id="first_name" name="first_name" type="text" placeholder="Tu nombre">
                            </div>
                            <div class="w-1/2 ml-1">
                                <label class="block text-grey-darker text-sm font-bold mb-2" for="last_name">Apellido</label>
                                <input class="appearance-none border rounded w-full py-2 px-3 text-grey-darker"
                                    id="last_name" name="last_name" type="text" placeholder="Tu apellido">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="block text-grey-darker text-sm font-bold mb-2" for="email">Correo</label>
                            <input class="appearance-none border rounded w-full py-2 px-3 text-grey-darker" id="email"
                                name="email" type="email" placeholder="Tu correo electrónico">
                        </div>
                        <div class="mb-4">
                            <label class="block text-grey-darker text-sm font-bold mb-2" for="password">Contraseña</label>
                            <input class="appearance-none border rounded w-full py-2 px-3 text-grey-darker"
                                id="password" name="password" type="password" autocomplete="new-password" placeholder="Tu contraseña segura">
                            <p class="text-grey text-xs mt-1">Mínimo 6 caracteres</p>
                        </div>
                        <div class="flex items-center justify-between mt-8">
                            <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-full"
                                type="submit">
                                Registrarse
                            </button>
                        </div>
                    </form>
                </div>
                <p class="text-center my-4">
                    <a href="index.html" class="text-white text-sm no-underline hover:text-grey-darker">Ya tengo una cuenta</a>
                </p>
            </div>
        </div>
        <!-- Footer -->
        <footer class="w-full bg-grey-lighter py-8">
            <div class="container mx-auto text-center px-8">
                <p class="text-white mb-2 text-sm">
                    <span class="font-bold">Capital Experts</span>
                    Made by CILABS
                </p>
            </div>
        </footer>
    </div>
</body>

</html>
